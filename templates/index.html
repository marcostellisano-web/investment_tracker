<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Solana Portfolio Tracker</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f8fafc 0%, #f1f5f9 100%);
      color: #0f172a;
      min-height: 100vh;
      padding: 1.5rem 1rem 2.25rem;
    }

    .app-shell {
      max-width: 980px;
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid #dbe2ea;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.55rem;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #0f172a;
    }

    .accent { color: #16a34a; }

    .subtitle { color: #475569; font-size: 0.9rem; margin-bottom: 1.4rem; }

    .label {
      display: inline-block;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.13em;
      color: #64748b;
      margin-bottom: 0.6rem;
      font-weight: 600;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #dbe2ea;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(15, 23, 42, 0.07);
      padding: 1.5rem;
      margin: 0 auto 1.25rem;
      backdrop-filter: blur(2px);
    }

    .card h2 {
      font-size: 1rem;
      font-weight: 650;
      margin-bottom: 1rem;
      color: #1e293b;
    }

    .wallet-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 1rem; }
    .wallet-row { display: flex; gap: 0.5rem; align-items: center; }

    .wallet-row input[type="text"] {
      background: #f8fafc;
      border: 1px solid #cdd5df;
      border-radius: 10px;
      color: #0f172a;
      padding: 0.6rem 0.8rem;
      font-size: 0.875rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    .wallet-row input[type="text"]:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.12);
      background: #ffffff;
    }

    .wallet-row .addr { flex: 2; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    .wallet-row .lbl  { flex: 1; }

    .btn-remove {
      background: #ffffff;
      border: 1px solid #cdd5df;
      border-radius: 8px;
      color: #64748b;
      cursor: pointer;
      padding: 0.45rem 0.6rem;
      font-size: 0.8rem;
      transition: all 0.15s;
    }

    .btn-remove:hover { border-color: #ef4444; color: #ef4444; }

    .row-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      font-weight: 620;
      padding: 0.6rem 1.1rem;
      transition: all 0.15s;
    }

    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-primary   { background: #0f172a; color: #fff; }
    .btn-primary:hover { background: #1f2937; }

    .btn-secondary { background: #ffffff; border-color: #cdd5df; color: #334155; }
    .btn-secondary:hover { border-color: #94a3b8; }

    .btn-save      { background: #16a34a; color: #f0fdf4; }
    .btn-save:hover { background: #15803d; }

    .btn-add       { background: #f8fafc; border: 1px dashed #9aa6b5; color: #475569; }
    .btn-add:hover { border-color: #16a34a; color: #166534; opacity: 1; }

    #status { color: #475569; font-size: 0.82rem; min-height: 1.2rem; margin-top: 0.75rem; }
    .err { color: #dc2626 !important; }
    .ok  { color: #16a34a !important; }

    #results { margin: 0 auto; }

    .results-card {
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #dbe2ea;
      border-radius: 22px;
      box-shadow: 0 15px 50px rgba(15, 23, 42, 0.07);
      overflow: hidden;
    }

    .error-banner {
      background: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      max-width: 980px;
      margin-left: auto;
      margin-right: auto;
    }

    .error-banner p { color: #be123c; font-size: 0.875rem; margin-bottom: 0.25rem; }
    .error-banner code { color: #e11d48; font-size: 0.8rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      padding: 0.8rem 1.2rem;
      text-align: left;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: #64748b;
      background: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }

    thead th:not(:first-child) { text-align: right; }
    tbody tr { border-bottom: 1px solid #edf2f7; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f8fafc; }
    td { padding: 0.72rem 1.2rem; font-size: 0.875rem; }
    td:not(:first-child) { text-align: right; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .token-cell { display: flex; align-items: center; gap: 0.6rem; }

    .token-logo {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #e2e8f0;
      border: 1px solid #d4dce5;
    }

    .token-logo-fallback {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #e2e8f0;
      border: 1px solid #d4dce5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.65rem;
      font-weight: 700;
      color: #334155;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .token-info { display: flex; flex-direction: column; gap: 0.1rem; }
    .token-symbol { font-weight: 700; color: #0f172a; font-size: 0.91rem; }
    .token-name   { font-size: 0.72rem; color: #64748b; }
    .token-price  { font-size: 0.72rem; color: #64748b; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

    .total-col { color: #0f172a; font-weight: 650; }
    .value-col { color: #16a34a; font-weight: 650; }
    .dim { color: #94a3b8; }
    .wallet-error { color: #dc2626; font-size: 0.75rem; }

    @media (max-width: 760px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .wallet-row { flex-wrap: wrap; }
      .wallet-row .addr,
      .wallet-row .lbl { flex: 1 1 100%; }
    }
  </style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <h1>portfolio<span class="accent">tracker</span></h1>
    </div>
  </div>

  <p class="subtitle">Paste your wallet addresses below — no file editing required.</p>
  <span class="label">Watchlist</span>

<div class="card">
  <h2>Wallets</h2>
  <div class="wallet-list" id="wallet-list"></div>

  <div class="row-actions">
    <button class="btn-add" onclick="addRow()">+ Add wallet</button>
  </div>

  <div style="display:flex;gap:0.5rem;margin-top:1.25rem;flex-wrap:wrap;">
    <button class="btn-primary" id="btn-fetch" onclick="fetchBalances()">Fetch Balances</button>
    <button class="btn-save"    id="btn-save"  onclick="saveWallets()">Save Addresses</button>
    <button class="btn-secondary"              onclick="clearAll()">Clear</button>
  </div>

  <div id="status"></div>
</div>

<div id="results"></div>
</div>

<script>
  const savedWallets = {{ saved_wallets | tojson }};
  const list = document.getElementById("wallet-list");

  function addRow(address = "", label = "") {
    const row = document.createElement("div");
    row.className = "wallet-row";
    row.innerHTML = `
      <input class="addr" type="text" placeholder="Wallet address" value="${address}" spellcheck="false" autocomplete="off" />
      <input class="lbl"  type="text" placeholder="Label (optional)" value="${label}" />
      <button class="btn-remove" onclick="this.closest('.wallet-row').remove()">✕</button>`;
    list.appendChild(row);
    if (!address) row.querySelector(".addr").focus();
  }

  function getWallets() {
    return [...list.querySelectorAll(".wallet-row")].map(row => ({
      address: row.querySelector(".addr").value.trim(),
      label:   row.querySelector(".lbl").value.trim(),
    })).filter(w => w.address);
  }

  function clearAll() {
    list.innerHTML = "";
    document.getElementById("results").innerHTML = "";
    setStatus("");
    addRow();
  }

  function setStatus(msg, cls = "") {
    const el = document.getElementById("status");
    el.textContent = msg;
    el.className = cls;
  }

  async function saveWallets() {
    const wallets = getWallets();
    if (!wallets.length) { setStatus("Nothing to save.", "err"); return; }

    const saveBtn = document.getElementById("btn-save");
    saveBtn.disabled = true;
    setStatus("Saving...");

    try {
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallets }),
      });

      if (!res.ok) {
        throw new Error(`Server returned ${res.status}`);
      }

      const data = await res.json();
      setStatus(
        data.ok ? `Saved ${wallets.length} wallet(s) — they'll load automatically next time.` : "Save failed.",
        data.ok ? "ok" : "err"
      );
    } catch (e) {
      setStatus("Save failed: " + e.message, "err");
    } finally {
      saveBtn.disabled = false;
    }
  }

  async function fetchBalances() {
    const wallets = getWallets();
    if (!wallets.length) { setStatus("Add at least one wallet address.", "err"); return; }

    document.getElementById("btn-fetch").disabled = true;
    setStatus(`Fetching ${wallets.length} wallet(s)... (first run also downloads token list, may take a moment)`);
    document.getElementById("results").innerHTML = "";

    try {
      const res = await fetch("/api/fetch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ wallets }),
      });
      const data = await res.json();
      renderResults(data);
      const shown = data.sorted_mints.length;
      const hiddenNote = data.hidden_count > 0 ? ` · ${data.hidden_count} under $1 hidden` : "";
      setStatus(`Found ${shown} token(s) across ${data.wallets.length} wallet(s)${hiddenNote}.`, "ok");
    } catch (e) {
      setStatus("Request failed: " + e.message, "err");
    } finally {
      document.getElementById("btn-fetch").disabled = false;
    }
  }

  function fmt(n) {
    if (n === 0) return "—";
    if (n >= 1000)   return n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (n >= 1)      return n.toFixed(4);
    if (n >= 0.0001) return n.toFixed(6);
    return n.toFixed(8);
  }

  function fmtUsd(n) {
    if (n === null || n === undefined) return "—";
    if (n >= 1_000_000) return "$" + (n / 1_000_000).toFixed(2) + "M";
    if (n >= 1_000)     return "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    if (n >= 1)         return "$" + n.toFixed(2);
    if (n >= 0.0001)    return "$" + n.toFixed(4);
    return "$" + n.toFixed(6);
  }

  function tokenCell(symbol, name, logoUri, usdPrice) {
    const logoHtml = logoUri
      ? `<img class="token-logo" src="${logoUri}" alt="${symbol}"
             onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
         <div class="token-logo-fallback" style="display:none">${symbol.slice(0,3)}</div>`
      : `<div class="token-logo-fallback">${symbol.slice(0,3)}</div>`;

    const priceHtml = usdPrice !== null && usdPrice !== undefined
      ? `<span class="token-price">${fmtUsd(usdPrice)}</span>`
      : "";

    return `<td>
      <div class="token-cell">
        ${logoHtml}
        <div class="token-info">
          <span class="token-symbol">${symbol}</span>
          ${name ? `<span class="token-name">${name}</span>` : ""}
          ${priceHtml}
        </div>
      </div>
    </td>`;
  }

  function renderResults({ wallets, totals, sorted_mints }) {
    let html = "";

    // Show wallet-level errors prominently above the table
    const walletErrors = wallets.filter(w => w.error);
    if (walletErrors.length) {
      html += `<div class="error-banner">`;
      walletErrors.forEach(w => {
        html += `<p>⚠ Could not fetch <strong>${w.label}</strong></p><code>${w.error}</code>`;
      });
      html += `</div>`;
    }

    if (!sorted_mints.length) {
      html += `<div class="card" style="text-align:center;color:#64748b;">No token balances found.</div>`;
      document.getElementById("results").innerHTML = html;
      return;
    }

    html += `<div class="results-card">`;

    html += `<table><thead><tr>
      <th>Token</th>
      <th>Balance</th>
      <th>Value</th>
      ${wallets.map(w => `<th>${w.label}</th>`).join("")}
    </tr></thead><tbody>`;

    for (const mint of sorted_mints) {
      const { symbol, name, logo_uri, total, usd_price, usd_value } = totals[mint];
      html += `<tr>
        ${tokenCell(symbol, name, logo_uri, usd_price)}
        <td class="total-col">${fmt(total)}</td>
        <td class="value-col">${fmtUsd(usd_value)}</td>
        ${wallets.map(w => {
          const amt = w.balances[mint]?.amount ?? 0;
          return `<td class="${amt > 0 ? "" : "dim"}">${fmt(amt)}</td>`;
        }).join("")}
      </tr>`;
    }

    html += `</tbody></table></div>`;
    document.getElementById("results").innerHTML = html;
  }

  // Boot: load saved wallets or start with one empty row
  if (savedWallets.length) {
    savedWallets.forEach(w => addRow(w.address, w.label));
  } else {
    addRow();
  }
</script>
</body>
</html>
